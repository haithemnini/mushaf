name: mushaf
description: >
  Flutter mushaf with Hafs and Warsh bundled and ready to read, including
  ayah selection, page navigation, fullscreen, and book layout.
version: 0.2.1
homepage: https://github.com/haithemnini/mushaf
repository: https://github.com/haithemnini/mushaf
issue_tracker: https://github.com/haithemnini/mushaf/issues
topics:
  - quran
  - mushaf
  - hafs
  - warsh

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  archive: ^4.0.9
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/quran/surahs/
    - assets/quran/chrome/
    - assets/fonts/chrome/
    - assets/packs/hafs.zip
    - assets/packs/warsh.zip
